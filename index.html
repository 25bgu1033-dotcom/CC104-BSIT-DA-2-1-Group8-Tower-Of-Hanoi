<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tower of Hanoi</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container text-center">
    <h1>Tower of Hanoi</h1>
    <p>Moves: <span id="move-count">0</span></p>
    <p id="message">Click a tower, then click where you want to move its top disk.</p>

    <div class="row towers">
      <div class="col-4 tower" data-tower="A">
        <div class="peg"></div>
        <div class="disks" id="disks-A"></div>
        <p class="tower-label">A</p>
      </div>
      <div class="col-4 tower" data-tower="B">
        <div class="peg"></div>
        <div class="disks" id="disks-B"></div>
        <p class="tower-label">B</p>
      </div>
      <div class="col-4 tower" data-tower="C">
        <div class="peg"></div>
        <div class="disks" id="disks-C"></div>
        <p class="tower-label">C</p>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
